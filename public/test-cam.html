<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Diagnóstico de Cámara - UCS</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      padding: 2rem;
      max-width: 600px;
      margin: 0 auto;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    h1 { font-size: 1.3rem; margin-top: 0; color: #38bdf8; }
    button {
      background: #0284c7;
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      margin: 0.5rem 0;
    }
    button:hover { background: #0369a1; }
    video {
      width: 100%;
      height: 280px;
      background: #020617;
      border-radius: 8px;
      object-fit: cover;
      transform: scaleX(-1);
      display: none;
      margin-top: 1rem;
      border: 2px solid #10b981;
    }
    pre {
      background: #020617;
      padding: 1rem;
      border-radius: 6px;
      font-size: 0.8rem;
      overflow-x: auto;
      color: #a5f3fc;
    }
    .badge {
      display: inline-block;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: bold;
    }
    .badge-ok { background: #166534; color: #86efac; }
    .badge-err { background: #991b1b; color: #fca5a5; }
    .badge-warn { background: #854d0e; color: #fef08a; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🔬 Diagnóstico Rápido de Cámara</h1>
    <p style="font-size: 0.85rem; color: #94a3b8;">
      Esta herramienta prueba el acceso directo del navegador a tu cámara web para detectar si el bloqueo viene de Google Chrome o de Windows.
    </p>

    <button id="btnProbar" onclick="probarCamara()">🎥 INICIAR PRUEBA DE CÁMARA</button>

    <video id="videoElement" autoplay playsinline muted></video>

    <div id="resultado" style="margin-top: 1rem;"></div>
  </div>

  <div class="card">
    <h3 style="margin-top: 0; font-size: 0.95rem;">📋 Registro de Diagnóstico</h3>
    <pre id="logOutput">Listo para probar...</pre>
  </div>

  <script>
    const logEl = document.getElementById('logOutput');
    const resEl = document.getElementById('resultado');
    const videoEl = document.getElementById('videoElement');

    function log(msg) {
      logEl.textContent += '\n' + msg;
      console.log(msg);
    }

    async function inspeccionarEntorno() {
      logEl.textContent = '--- INSPECCIÓN DE ENTORNO ---';
      log('Origen: ' + window.location.origin);
      log('isSecureContext: ' + window.isSecureContext);
      log('navigator.mediaDevices disponible: ' + Boolean(navigator.mediaDevices));

      if (navigator.permissions && navigator.permissions.query) {
        try {
          const p = await navigator.permissions.query({ name: 'camera' });
          log('Estado del Permiso en Chrome (permissions.query): ' + p.state);
        } catch (e) {
          log('permissions.query(camera) no soportado: ' + e.message);
        }
      }

      if (navigator.mediaDevices && navigator.mediaDevices.enumerateDevices) {
        try {
          const devices = await navigator.mediaDevices.enumerateDevices();
          const videoDevs = devices.filter(d => d.kind === 'videoinput');
          log('Cámaras detectadas: ' + videoDevs.length);
          videoDevs.forEach((d, i) => {
            log('  [' + i + '] ' + (d.label || '(Etiqueta oculta por falta de permiso)') + ' - id: ' + d.deviceId.slice(0, 10) + '...');
          });
        } catch (e) {
          log('Error al enumerar dispositivos: ' + e.message);
        }
      }
    }

    inspeccionarEntorno();

    async function probarCamara() {
      log('\n--- SOLICITANDO STREAM DE VIDEO (getUserMedia) ---');
      resEl.innerHTML = '<span class="badge badge-warn">⏳ Solicitando acceso al navegador...</span>';

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: true,
          audio: false
        });

        log('✅ ÉXITO: getUserMedia otorgó el stream de video!');
        log('Tracks activos: ' + stream.getVideoTracks().length);
        const track = stream.getVideoTracks()[0];
        log('Cámara activa: ' + track.label);

        videoEl.srcObject = stream;
        videoEl.style.display = 'block';
        videoEl.play();

        resEl.innerHTML = '<div style="background: rgba(22, 101, 52, 0.4); border: 1px solid #16a34a; padding: 0.75rem; border-radius: 8px;">' +
          '<strong style="color: #4ade80;">🎉 ¡CÁMARA FUNCIONANDO CORRECTAMENTE!</strong><br>' +
          '<span style="font-size: 0.85rem; color: #bbf7d0;">Dispositivo: ' + track.label + '</span>' +
        '</div>';
      } catch (err) {
        log('❌ ERROR EN getUserMedia: ' + err.name + ': ' + err.message);

        let orientacion = '';
        if (err.name === 'NotAllowedError') {
          orientacion = '<div style="margin-top: 0.5rem; font-size: 0.8rem; color: #fca5a5;">' +
            '<strong>Causa frecuente:</strong> Windows 10/11 tiene bloqueado el acceso a la cámara para aplicaciones de escritorio.<br>' +
            '👉 Ve a: <strong>Configuración de Windows ➜ Privacidad y seguridad ➜ Cámara</strong> y asegúrate de que esté ACTIVADO "Permitir que las aplicaciones de escritorio accedan a la cámara".' +
          '</div>';
        } else if (err.name === 'NotReadableError') {
          orientacion = '<div style="margin-top: 0.5rem; font-size: 0.8rem; color: #fca5a5;">' +
            '<strong>Causa:</strong> La cámara está ocupada por otra app (cierra la app Cámara de Windows, Teams o Zoom).' +
          '</div>';
        }

        resEl.innerHTML = '<div style="background: rgba(153, 27, 27, 0.4); border: 1px solid #dc2626; padding: 0.75rem; border-radius: 8px;">' +
          '<strong style="color: #f87171;">❌ No se pudo conectar: ' + err.name + '</strong><br>' +
          '<span style="font-size: 0.85rem; color: #fca5a5;">' + err.message + '</span>' +
          orientacion +
        '</div>';
      }
    }
  </script>
</body>
</html>
